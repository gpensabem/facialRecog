version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: facedb_mvp
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: facedb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Esta é a linha nova: mapeia o seu arquivo local para dentro do container
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: